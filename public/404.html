<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página no encontrada — OficioAI</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',system-ui,sans-serif;background:#04060b;color:#f1f5f9;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;position:relative;overflow:hidden;-webkit-font-smoothing:antialiased}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:48px 48px;mask-image:radial-gradient(ellipse at 50% 40%,#000 15%,transparent 70%);-webkit-mask-image:radial-gradient(ellipse at 50% 40%,#000 15%,transparent 70%)}
.orb{position:absolute;border-radius:50%;filter:blur(80px);animation:float 10s ease-in-out infinite}
.o1{width:340px;height:340px;background:rgba(99,102,241,.35);top:-100px;right:-100px}
.o2{width:260px;height:260px;background:rgba(168,85,247,.25);bottom:-80px;left:-80px;animation-delay:3s}
.o3{width:180px;height:180px;background:rgba(236,72,153,.15);top:45%;left:55%;animation-delay:6s}
@keyframes float{50%{transform:translate(20px,-20px) scale(1.08)}}
.content{position:relative;z-index:1;max-width:420px}
h1{font-size:7rem;font-weight:900;line-height:1;letter-spacing:-4px;background:linear-gradient(135deg,#818CF8,#a855f7,#ec4899);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
h2{font-size:1.3rem;font-weight:700;margin:18px 0 10px;color:#e2e8f0}
p{font-size:.95rem;color:#94a3b8;margin-bottom:32px;line-height:1.6}
a{display:inline-block;background:linear-gradient(135deg,#6366F1,#8B5CF6);color:#fff;padding:14px 36px;border-radius:12px;font-size:.95rem;font-weight:700;text-decoration:none;box-shadow:0 4px 16px rgba(99,102,241,.3);transition:all .25s;position:relative;overflow:hidden}
a:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(99,102,241,.4)}
a::after{content:'';position:absolute;top:0;bottom:0;width:45%;left:-70%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.3),transparent);transform:skewX(-20deg);transition:left .7s cubic-bezier(.16,1,.3,1)}
a:hover::after{left:135%}
.logo{font-size:1rem;font-weight:800;color:#64748b;margin-top:44px;letter-spacing:-.3px}
.logo span{background:linear-gradient(135deg,#818CF8,#a855f7);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,transparent 55%,rgba(4,6,11,.6) 100%);pointer-events:none}
</style>
</head>
<body>
<div class="grid"></div>
<div class="orb o1"></div>
<div class="orb o2"></div>
<div class="orb o3"></div>
<div class="vig"></div>
<div class="content">
<h1>404</h1>
<h2>Esta página no existe</h2>
<p>Puede que el enlace esté mal escrito o que la página se haya movido.</p>
<a href="/">Volver al inicio</a>
<div class="logo">Oficio<span>AI</span></div>
</div>
</body>
</html>
