<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página no encontrada — OficioAI</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#050507;color:#f1f5f9;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;position:relative;overflow:hidden}
.orb{position:absolute;border-radius:50%;filter:blur(80px);opacity:.2}
.orb1{width:300px;height:300px;background:#6366F1;top:-80px;right:-80px}
.orb2{width:200px;height:200px;background:#a855f7;bottom:-60px;left:-60px}
.content{position:relative;z-index:1}
h1{font-size:6rem;font-weight:800;background:linear-gradient(135deg,#6366F1,#a855f7,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1}
h2{font-size:1.4rem;font-weight:700;margin:16px 0 8px;color:#e2e8f0}
p{font-size:1rem;color:#94a3b8;margin-bottom:28px}
a{display:inline-block;background:linear-gradient(135deg,#6366F1,#8B5CF6);color:#fff;padding:14px 36px;border-radius:12px;font-size:1rem;font-weight:700;text-decoration:none;box-shadow:0 4px 16px rgba(99,102,241,.3);transition:all .25s}
a:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(99,102,241,.4)}
.logo{font-size:1.1rem;font-weight:800;color:#64748b;margin-top:40px}
.logo span{background:linear-gradient(135deg,#6366F1,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
</style>
</head>
<body>
<div class="orb orb1"></div>
<div class="orb orb2"></div>
<div class="content">
<h1>404</h1>
<h2>Esta página no existe</h2>
<p>Puede que el enlace esté mal escrito o que la página se haya movido.</p>
<a href="/">Volver al inicio</a>
<div class="logo">Oficio<span>AI</span></div>
</div>
</body>
</html>
